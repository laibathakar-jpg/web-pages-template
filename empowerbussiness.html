<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="empowerbussiness.css" />
  <title>Empower Business</title>
</head>
<body>
  <header class="navbar">
    <div class="brand" aria-label="Capgemen brand">
      <div class="logo" aria-hidden="true"></div>
      <h3>Capgemen<span>.</span></h3>
    </div>

    <nav aria-label="Primary">
      <ul class="nav-links">
        <li>Home</li>
        <li>Pricing</li>
        <li>Product</li>
        <li>Contact</li>
      </ul>
    </nav>

    <div class="nav-actions" aria-label="Actions">
      <a class="icon-pill" href="#" aria-label="Search"><i class="fas fa-search"></i></a>
      <a class="icon-pill" href="#" aria-label="Cart"><i class="fas fa-shopping-cart"></i></a>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div class="hero-text">
        <div class="kicker">
          <span class="dot" aria-hidden="true"></span>
          <span>Build faster. Grow smarter.</span>
        </div>

        <h1>
          <span class="grad">EMPOWER</span><br />
          YOUR BUSINESS
        </h1>

        <p>
          We know how large obstacles can act—but we also help you turn small-scale momentum into measurable results.
        </p>

        <div class="button-row">
          <button class="btn btn-primary" type="button">Get Quest More</button>
          <button class="btn" type="button">Learn More</button>
        </div>
      </div>

      <div class="hero-media">
        <div class="media-card" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1531297484001-80022131f5a1?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHxzZWFyY2h8Mnx8Y29tcGFueXxlbnwwfHwwfHw%3D&w=1000&q=80"
            alt="Team working and planning"
          />
          <div class="media-badges">
            <div class="badge">
              <b>Strategy</b>
              <span>Clear roadmaps for growth</span>
            </div>
            <div class="badge">
              <b>Execution</b>
              <span>From ideas to real results</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
